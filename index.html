<!-- CHARACTERS SECTION - Replace your current one with this -->
<section id="characters" class="py-24 bg-black/60">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-5xl font-bold title-font neon-text-cyan text-center mb-12">YOUR SIGNATURE CHARACTERS</h2>
    
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      <!-- 1. Latex Demoness -->
      <div class="group bg-black rounded-3xl overflow-hidden border border-white/10 hover:border-pink-500 transition-all">
        <img src="https://picsum.photos/id/1011/400/400" class="w-full aspect-square object-cover group-hover:scale-110 transition-transform" alt="Latex Demoness">
        <div class="p-4 text-center">
          <div class="text-cyan-400 font-medium">Latex Demoness</div>
          <button onclick="useCharacter('Latex Demoness')" class="mt-3 text-xs px-6 py-2 bg-pink-500/20 hover:bg-pink-500 rounded-full transition-colors">Use Character</button>
        </div>
      </div>
