  <script>
    // Mobile menu
    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    mobileBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      mobileBtn.querySelector('i').classList.toggle('fa-bars');
      mobileBtn.querySelector('i').classList.toggle('fa-times');

    function fakeGenerate() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return alert("Enter a dirty fantasy first…");
      alert("✅ Prompt received! Generating now...");
    }

    // Gallery Data
    const galleryVideos = [
      { title: "Latex Succubus Claims Her Prey", duration: "2:38", style: "REALISTIC 4K", thumb: "https://picsum.photos/id/1015/600/340", videoUrl: "https://assets.mixkit.co/videos/preview/12345/12345-large.mp4" },
      { title: "Tentacle Hentai Overload", duration: "1:55", style: "ANIME • HENTAI", thumb: "https://picsum.photos/id/201/600/340", videoUrl: "https://assets.mixkit.co/videos/preview/23456/23456-large.mp4" },
      { title: "Cyberpunk Elf Gangbang", duration: "3:12", style: "3D ANIMATION", thumb: "https://picsum.photos/id/237/600/340", videoUrl: "https://assets.mixkit.co/videos/preview/34567/34567-large.mp4" },
      { title: "Vampire Queen Eternal Night", duration: "2:45", style: "REALISTIC", thumb: "https://picsum.photos/id/180/600/340", videoUrl: "https://assets.mixkit.co/videos/preview/45678/45678-large.mp4" },
      { title: "Zero Gravity Demoness", duration: "1:48", style: "HYPER-STYLIZED", thumb: "https://picsum.photos/id/251/600/340", videoUrl: "https://assets.mixkit.co/videos/preview/56789/56789-large.mp4" },
      { title: "BDSM Robot Mistress", duration: "2:20", style: "FETISH • 4K", thumb: "https://picsum.photos/id/316/600/340", videoUrl: "https://assets.mixkit.co/videos/preview/67890/67890-large.mp4" }
    ];

    function renderGallery() {
      const container = document.getElementById('gallery-grid');
      container.innerHTML = '';

      galleryVideos.forEach(video => {
        const card = document.createElement('div');
        card.className = `video-card group bg-black rounded-3xl overflow-hidden border border-white/10 hover:border-pink-500 cursor-pointer`;
        card.innerHTML = `
          <div class="aspect-video relative">
            <img src="${video.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute inset-0 flex items-center justify-center bg-black/40 group-hover:bg-black/20 transition-colors">
              <i class="fas fa-play text-6xl text-white/80"></i>
            </div>
            <div class="absolute top-3 right-3 bg-black/70 text-[10px] px-2 py-1 rounded font-mono">${video.duration}</div>
          </div>
          <div class="p-5">
            <div class="text-xs text-cyan-400 tracking-widest">${video.style}</div>
            <div class="font-semibold mt-1 leading-tight">${video.title}</div>
          </div>
        `;
        card.addEventListener('click', () => openModal(video));
        container.appendChild(card);
      });
    }

    function openModal(video) {
      const modal = document.getElementById('video-modal');
      const videoEl = document.getElementById('modal-video');
      const titleEl = document.getElementById('modal-title');

      titleEl.textContent = video.title;
      videoEl.src = video.videoUrl;
      modal.classList.remove('hidden');
      videoEl.play();
    }

    function closeModal() {
      const modal = document.getElementById('video-modal');
      const videoEl = document.getElementById('modal-video');
      videoEl.pause();
      videoEl.src = '';
      modal.classList.add('hidden');
    }

    // Close modal with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape") closeModal();
    });

    // Click outside to close
    document.getElementById('video-modal').addEventListener('click', (e) => {
      if (e.target.id === 'video-modal') closeModal();
    });

    // Init
    window.onload = renderGallery;
  </script>
